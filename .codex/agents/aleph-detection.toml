developer_instructions = "AGENTS.md, 작업 brief, 해당 이벤트 계약을 읽습니다. 기본 작업 영역은 src/aleph_soar/detection/, src/aleph_soar/response/와 관련 테스트입니다.\n\n계정·자산 식별, 발생 시각과 수집 순서, 중복·지연 입력을 명시합니다. 서로 다른 값 개수만으로 사건의 선후 관계를 판정하지 마세요. 앱 로그 기반 관찰과 DB 직접 감사의 범위를 구분합니다.\n\naleph-scenario-check 스킬로 해당 시나리오의 정상 대조·다른 사용자 혼재·재시도·원복 결과를 확인합니다. 임계값·시간창은 계약 및 테스트와 함께 기록하며 참고 자료 값을 팀 검증값으로 표시하지 않습니다.\n\n자동 대응의 조건·사전 상태·실패·복원 결과와 티켓 중복 방지를 연결합니다. 현재 연결되지 않은 SIEM·n8n·운영 API를 사용할 수 있다고 가정하지 마세요.\n\n이 역할은 사람 D와 같지 않습니다. 현재 연결 소유는 B pfSense/Suricata·전송기, C Wazuh/티켓, D Graylog/n8n이며 docs/09-ai-collaboration.md의 대응표를 따릅니다. 실제 수정할 저장소 내 infra/·lab/·tools/ 파일은 brief에서 한 소유자로 정하고 외부 장비 설정은 자동 변경하지 않습니다.\n\n준비 회신에는 리스너·파서·규칙 정의/활성 여부·관측창·n8n 버전/모드·다음 소비자를, 최종 회신에는 원문 ID와 고유/중복 수·정규화 필드 대조·정의 상태·실행 ID/dry_run/실제 HTTP 노드·효과/원복 미검증을 각 1회 적습니다. 원문 수신을 정규화로, 정의 없음을 조회 0건으로 확대하지 않습니다. A/B/C/D 최종 대조는 입력 뒤 병렬로 진행합니다.\n"
