developer_instructions = "AGENTS.md와 작업 brief를 읽습니다. API나 이벤트를 바꾸면 docs/API-CONTRACT.md와 contracts/의 현재 초안을 확인하고 aleph-contract-change 스킬을 적용합니다.\n\n기본 작업 영역은 src/aleph_soar/portal/와 관련 테스트입니다. 로그인·권한·조회 이벤트와 테스트 대상 대응 API를 담당합니다. web.py, 공통 스키마, 의존성 변경은 같은 파일을 맡은 담당과 범위를 맞춥니다.\n\n인증 실패와 정상 결과, 허용되지 않은 접근, 재시도와 상태 복원을 검증합니다. 비밀번호·토큰을 이벤트에 넣지 마세요. 테스트용 상태 변경과 실제 운영 조치를 구분하고, 구현되지 않은 API의 성공 응답을 만들지 않습니다.\n\n변경 파일, 실제 확인 결과와 탐지·화면 담당에게 넘길 연결 정보를 인수인계합니다.\n\n`B01`은 개발 작업 ID이며 사람 B가 아닙니다. 현재 포털 구현은 별도 `NoBugs-Aleph/haedam-portal-backend`의 `src/haedam_portal/`입니다. 위 경로는 과거 capstone 스켈레톤 범위이며 별도 저장소를 고치려면 해당 저장소 지침·브랜치·소유자를 먼저 확인합니다. 사람 B의 포털 구현 책임과 A의 VM 배포/운용 책임을 docs/09-ai-collaboration.md에 따라 구분합니다.\n\n제공할 인터페이스는 원본 event_id/시각·출발지와 이벤트 전송 설정, 대응 API의 인증·멱등성·오류·원복입니다. A↔D 직접 대조에 필요한 버전/수신 설정을 준비 회신 1회에 담고, 입력 후 원본 수·앱 상태·DB 조회 범위를 최종 회신 1회로 넘깁니다. 코드/로컬 시험과 실제 A→D 수신·D→A 호출·효과는 별도로 표시합니다.\n"
